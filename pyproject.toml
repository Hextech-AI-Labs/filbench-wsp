[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filbench-wsp"
version = "0.1.0"
description = "LLM-Driven Weight-Space Programming for Philippine Language Capability Enhancement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "safetensors>=0.4.3",
    "accelerate>=0.30.0",
    "huggingface-hub>=0.23.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]